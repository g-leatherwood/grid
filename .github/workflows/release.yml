name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Check the README logo shows this version
        run: |
          grep -q -- " ${GITHUB_REF_NAME} /" README.md || {
            echo "::error::The logo in README.md should show ${GITHUB_REF_NAME} in its alt text. Update it, run go test -run TestReadmeLogo -update, commit, and tag again."
            exit 1
          }
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
